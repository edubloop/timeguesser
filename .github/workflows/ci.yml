name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocks on critical advisories only. Four high-severity advisories remain
      # (vite, ws, postcss, brace-expansion), all transitive under Expo and
      # React Native.
      #
      # Upgrading to Expo SDK 57 clears vite, ws, and brace-expansion, but NOT
      # postcss — it stays in Expo's own build tooling. Measured on 2026-08-02:
      # SDK 54 = 19 advisories (4 high); SDK 57 = 12 advisories (1 high).
      # So `--audit-level=high` cannot be restored by upgrading alone; it needs
      # postcss to be fixed upstream. See TG-012.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Run checks
        run: npm run check

  maestro-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "iPhone 16" || true
          open -a Simulator

      - name: Build release app on simulator
        run: npx expo run:ios --device "iPhone 16" --configuration Release

      - name: Run Maestro photo viewer smoke flow
        run: maestro test .maestro/photo-viewer.yaml
