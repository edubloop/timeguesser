<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeGuesser — Mobile UI Kit</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #E8EDEA; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #root { height: 100%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ── App State Machine ──────────────────────────────────────────────────────────
// Screens: home → study → guess → results → home
// Tab:     play | settings

function App() {
  const [screen, setScreen] = React.useState('home');
  const [tab, setTab]       = React.useState('home');
  const [round, setRound]   = React.useState(1);
  const [pinPlaced, setPinPlaced] = React.useState(false);
  const [showReveal, setShowReveal] = React.useState(false);

  function handleTab(t) {
    setTab(t);
    if (t === 'home') setScreen('home');
    if (t === 'settings') setScreen('settings');
  }

  function handleStart() {
    setRound(1);
    setPinPlaced(false);
    setShowReveal(false);
    setScreen('study');
  }

  function handleSwipeUp()  { setScreen('guess'); }
  function handlePlacePin() { setPinPlaced(true); }
  function handleGuess()    { setShowReveal(true); }

  function handleNext() {
    if (round >= 5) {
      setScreen('results');
    } else {
      setRound(r => r + 1);
      setPinPlaced(false);
      setShowReveal(false);
      setScreen('study');
    }
  }

  function handlePlayAgain() {
    setRound(1);
    setPinPlaced(false);
    setShowReveal(false);
    setTab('home');
    setScreen('home');
  }

  const showTabs = screen === 'home' || screen === 'settings';

  function renderScreen() {
    if (screen === 'home')     return <HomeScreen onStart={handleStart} />;
    if (screen === 'settings') return <SettingsScreen />;
    if (screen === 'study')    return <StudyScreen round={round} onSwipeUp={handleSwipeUp} />;
    if (screen === 'guess')    return <GuessScreen
      round={round}
      pinPlaced={pinPlaced}
      onPlacePin={handlePlacePin}
      showReveal={showReveal}
      onGuess={handleGuess}
      onNext={handleNext}
    />;
    if (screen === 'results')  return <ResultsScreen onPlayAgain={handlePlayAgain} />;
    return null;
  }

  return (
    <IOSDevice>
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minHeight: 0 }}>
          {renderScreen()}
        </div>
        {showTabs && <TabBar active={tab} onTab={handleTab} />}
      </div>
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
