<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F5F7; padding: 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 4px; }
  .swatch-wrap { flex: 1; }
  .swatch { height: 52px; border-radius: 6px; }
  .label { font-size: 10px; font-weight: 500; color: #6B6B70; margin-top: 5px; }
  .hex { font-size: 9px; color: #98989D; }
  .section-label { font-size: 10px; font-weight: 600; color: #98989D; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
  .gap { height: 12px; }
</style>
</head>
<body>
<div class="section-label">Accent — Light</div>
<div class="row">
  <div class="swatch-wrap"><div class="swatch" style="background:#1A8A7D;"></div><div class="label">Primary</div><div class="hex">#1A8A7D</div></div>
  <div class="swatch-wrap"><div class="swatch" style="background:#15756A;"></div><div class="label">Pressed</div><div class="hex">#15756A</div></div>
  <div class="swatch-wrap"><div class="swatch" style="background:#E8F5F3; border: 1px solid #B0D9D4;"></div><div class="label">Subtle</div><div class="hex">#E8F5F3</div></div>
  <div class="swatch-wrap"><div class="swatch" style="background:#B0D9D4;"></div><div class="label">Muted</div><div class="hex">#B0D9D4</div></div>
</div>
<div class="gap"></div>
<div class="section-label">Accent — Dark</div>
<div class="row">
  <div class="swatch-wrap"><div class="swatch" style="background:#2BBFAD;"></div><div class="label">Primary</div><div class="hex">#2BBFAD</div></div>
  <div class="swatch-wrap"><div class="swatch" style="background:#239E90;"></div><div class="label">Pressed</div><div class="hex">#239E90</div></div>
  <div class="swatch-wrap"><div class="swatch" style="background:#1A2F2D;"></div><div class="label">Subtle</div><div class="hex">#1A2F2D</div></div>
  <div class="swatch-wrap"><div class="swatch" style="background:#2A4A46;"></div><div class="label">Muted</div><div class="hex">#2A4A46</div></div>
</div>
</body>
</html>
